name: 每週更新題庫

on:
  schedule:
    - cron: "0 22 * * 6"   # 每週六 22:00 UTC = 臺灣時間每週日早上 6:00
  workflow_dispatch:
    inputs:
      units:
        description: 這次要補題的單元數
        default: "12"

permissions:
  contents: write

concurrency:
  group: weekly-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - name: 產生並驗證新題目
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          UNITS_PER_RUN: ${{ inputs.units || vars.UNITS_PER_RUN || '12' }}
          MODEL: ${{ vars.MODEL || 'claude-opus-5-5' }}
        run: node scripts/update-bank.mjs
      - name: 格式檢查
        run: node scripts/validate.mjs
      - name: 提交更新
        run: |
          if git diff --quiet -- data; then
            echo "題庫沒有變動"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          git commit -m "題庫每週更新 $(date -u +%F)"
          git push
